{% extends "base.html" %}

{% block content %}

<div class="container">

    <h1>Registro de presencia</h1>

    <!-- 🔹 Filtros -->
    <form method="GET" class="presencia-filtros">
        <div class="presencia-campo">
            <label>Fecha</label>
            <input type="date" name="fecha" value="{{ fecha }}">
        </div>

        <div class="presencia-campo">
            <label>Hora</label>
            <input type="number" name="hora" value="{{ hora }}" min="1">
        </div>

        <button type="submit" class="presencia-btn-ver">Ver</button>
    </form>

    <!-- 🔹 Lista de profesores -->
    <form method="POST" class="presencia-box">

        <input type="hidden" name="fecha" value="{{ fecha }}">
        <input type="hidden" name="hora" value="{{ hora }}">

        <h3>Profesores</h3>

        <div class="presencia-lista">
            {% for p in profesores %}
                <label class="presencia-item">
                    <input
                        type="checkbox"
                        name="profesores"
                        value="{{ p.id_profesor }}"
                        {% if p.id_profesor in presentes %}checked{% endif %}
                    >
                    <span>{{ p.nombre }}</span>
                </label>
            {% endfor %}
        </div>

        <button type="submit" class="presencia-btn-guardar">
            Guardar presencia
        </button>

    </form>

</div>

{% endblock %}
